name: Ronda review (dogfood)

# Runs Ronda's own reusable review workflow against this repository's pull
# requests, so miss evidence can accumulate on real PRs (issues #103, #109).
# This is the adopter caller from docs/adoption/ronda-review-adoption.md, with
# these deliberate differences:
#
# - `uses: ./...` instead of `lhpaul/ronda/...@main`. On `pull_request` the
#   called workflow is the one at the PR's merge commit, so a change to
#   `ronda-review.yml` is exercised by its own PR. The Ronda code that actually
#   reviews is still checked out from `ronda_ref` (the reusable workflow's
#   default, `main`), never from the PR under review.
# - `branches: [develop]` on `pull_request`, so only PRs targeting the
#   integration branch are reviewed automatically. A `/ronda review` comment is
#   an explicit request and is honoured on any pull request.
#
# `issue_comment` workflows are loaded from the default branch, so the comment
# path is only live once this file is on `develop`; the PR that changes it
# cannot exercise it. Its proof is recorded after merge (issue #109).
#
# Uses `pull_request`, never `pull_request_target`: the reusable workflow's
# fork guard assumes a fork PR carries a read-only token and no secrets. The
# comment path does not check out or run anything from the PR: Ronda is checked
# out from `ronda_ref`, and it reads the PR through the API.

on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  ronda:
    # Must NOT be named "Ronda review". That is the constant name of the check
    # run Ronda publishes (docs/adoption/ronda-review-adoption.md, section 4),
    # and an automatic pass skips itself with `already_reviewed_automatically`
    # when any check run of that name already exists on the head SHA. A caller
    # job with that name (including the skipped one a draft PR produces) trips
    # that guard, so the pass would skip itself and publish nothing.
    name: Ronda dogfood
    # Caller-side pre-filter. It only saves runner minutes and keeps the model
    # secret away from runs that cannot be a review request; Ronda re-checks
    # the draft state, the exact command line and the author association itself
    # (src/cli/resolve-trigger.ts), so this must never be stricter than Ronda.
    # Hence `contains` (case-insensitive) rather than `startsWith`: Ronda
    # accepts the command after blank or quoted lines, and an expression cannot
    # tell the first unquoted line. The association list mirrors Ronda's.
    # A `/ronda review` comment is honoured on any pull request, not only one
    # targeting `develop`: the comment is the explicit request, and the
    # `branches:` filter above constrains `pull_request` runs alone.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft != true) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/ronda review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # Job-level, not workflow-level (issue #109). Workflow-level `concurrency` is
    # evaluated for the whole run before any job `if:`, so every PR comment would
    # enter a group there — including ones the `if:` above rejects. A concurrency
    # group keeps at most one run `pending` by default, and a newly queued run
    # replaces it ("any existing pending job or workflow in the same concurrency
    # group will be canceled and the new queued job or workflow will take its
    # place"), so such a comment could displace a queued pass and then skip on
    # its own `if:`, leaving that head SHA unreviewed. Job-level `concurrency` is
    # acquired only after this job's `if:` passes, so a run the `if:` rejects
    # never enters a group at all.
    #
    # One group per PR, so a manual pass on a PR is serialized with the
    # automatic ones: two passes on one head SHA never run together, which would
    # let both find no check run and publish two, breaking the one-check-run-
    # per-head-SHA contract (docs/adoption/ronda-review-adoption.md, section 4).
    #
    # `pull_request` is the only automatic trigger, so the `issue_comment` arm
    # never dereferences a null `issue.pull_request`.
    #
    # Residual: `contains` is the widest predicate available — GitHub expressions
    # have no regex and cannot select the first unquoted line, so none can mirror
    # `matchesReviewCommand` (src/cli/resolve-trigger.ts). A comment that contains
    # the phrase without being a well-formed command (`/ronda review later`)
    # passes this `if:`, joins the PR's group, and — since a newly queued run
    # replaces an existing `pending` one — can displace a queued run of either
    # arm before Ronda rejects it and publishes nothing. If the displaced run
    # was a `synchronize` pass queued for a new head SHA, that head then has no
    # published review until a later comment or push; if it was a manual
    # re-request, the request is lost and one more comment restores it. An
    # in-flight pass is never affected: this arm does not cancel in progress.
    #
    # Narrowing closes that hole — the phrase-only comment then fails this `if:`,
    # the job is skipped, and it joins no group at all — but it opens a worse
    # one: an exact or prefix test (`body == '/ronda review'`, `startsWith`)
    # drops forms Ronda accepts, namely a command after a quoted, blank or
    # whitespace-led first line. Those forms then join no group either, so a
    # manual and an automatic pass on one head SHA can run together, both find
    # no check run, and publish two — breaking the contract above. `queue: max`,
    # which would keep a queued run from being replaced, cannot be combined with
    # `cancel-in-progress: true` and is rejected by the pinned actionlint in
    # .github/workflows/actionlint.yml.
    #
    # The wider predicate is the recoverable side of the trade: a displaced run
    # costs one more comment or push, while two check runs for one head SHA
    # break the contract above and no later pass repairs them.
    #
    # A secretless preflight job running `matchesReviewCommand` and gating this
    # job on its output would close the hole exactly — unlike an expression, a
    # job applies the real parser. It is not done here because a caller-side
    # copy of the parser must track src/cli/resolve-trigger.ts for the life of
    # this file, and a copy that drifts fails silently in the direction that
    # publishes two check runs for one head SHA. Call the parser rather than
    # reimplement it if you need the hole shut.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request'
        && format('ronda-review-{0}', github.event.pull_request.number)
        || format('ronda-review-{0}', github.event.issue.number) }}
      # Only a push, which introduces a new head SHA, may cancel an in-flight
      # pass. `reopened` and `ready_for_review` keep the same SHA, and a run
      # cancelled after the review is published but before the terminal check
      # run is created would let its replacement publish a second review for
      # that SHA: the Actions path has no review-level dedup, only the
      # check-run lookup. Those events queue behind the running pass instead
      # and then skip on its check run.
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    # A called reusable workflow can only narrow the caller's token, never
    # widen it, and this repository's default is read-only. Required.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ./.github/workflows/ronda-review.yml
    secrets:
      model_api_key: ${{ secrets.RONDA_MODEL_API_KEY }}
